<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">EncodeEd compression visualizer dashboard</title>
  <desc id="desc">A dashboard-style visual based on EncodeEd, showing algorithm selection, text input, compressed output, explanations, Huffman tree visualization, and runtime sampling.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111317"/>
      <stop offset="0.52" stop-color="#171b22"/>
      <stop offset="1" stop-color="#101115"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <style>
      .title { fill: #89b4fa; font: 800 42px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .label { fill: #cdd6f4; font: 700 23px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .small { fill: #b4bdd6; font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .code { fill: #f5e0dc; font: 500 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .muted { fill: #a6adc8; font: 500 17px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .blue { fill: #89b4fa; font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .green { fill: #a6e3a1; font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .yellow { fill: #f9e2af; font: 700 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .panel { fill: #1b1f27; stroke: #343a46; stroke-width: 2; }
      .soft-panel { fill: #171b22; stroke: #2d3441; stroke-width: 2; }
      .selected { fill: #20283a; stroke: #89b4fa; stroke-width: 2; }
      .bar-bg { fill: #252b36; }
      .bar-blue { fill: #89b4fa; }
      .bar-green { fill: #a6e3a1; }
      .tree-line { fill: none; stroke: #7f8ea3; stroke-width: 2.4; stroke-linecap: round; }
      .tree-node { fill: #202632; stroke: #89b4fa; stroke-width: 2; }
      .plot-line { fill: none; stroke: #a6e3a1; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <path d="M0 92H1200M0 188H1200M0 284H1200M0 380H1200M0 476H1200M0 572H1200M0 668H1200" stroke="#252a33" stroke-width="1"/>
  <path d="M120 0V750M240 0V750M360 0V750M480 0V750M600 0V750M720 0V750M840 0V750M960 0V750M1080 0V750" stroke="#20242c" stroke-width="1"/>

  <text x="72" y="76" class="title">EncodeEd</text>
  <text x="72" y="114" class="small">PyQt compression visualizer with explanations and runtime sampling</text>

  <g filter="url(#shadow)">
    <rect x="72" y="156" width="262" height="500" rx="10" class="panel"/>
    <text x="104" y="202" class="label">algorithms</text>
    <rect x="104" y="236" width="198" height="38" rx="6" class="soft-panel"/>
    <text x="122" y="261" class="muted">Run-Length</text>
    <rect x="104" y="286" width="198" height="38" rx="6" class="selected"/>
    <text x="122" y="311" class="blue">Huffman</text>
    <rect x="104" y="336" width="198" height="38" rx="6" class="soft-panel"/>
    <text x="122" y="361" class="muted">Shannon-Fano</text>
    <rect x="104" y="386" width="198" height="38" rx="6" class="soft-panel"/>
    <text x="122" y="411" class="muted">LZW</text>
    <rect x="104" y="436" width="198" height="38" rx="6" class="soft-panel"/>
    <text x="122" y="461" class="muted">Arithmetic</text>
    <rect x="104" y="486" width="198" height="38" rx="6" class="soft-panel"/>
    <text x="122" y="511" class="muted">LZ77</text>
    <text x="104" y="586" class="green">compress</text>
    <text x="214" y="586" class="yellow">decompress</text>
    <text x="104" y="626" class="muted">manual text or .txt</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="374" y="156" width="360" height="210" rx="10" class="panel"/>
    <text x="406" y="202" class="label">input / output</text>
    <text x="406" y="248" class="code">HELLO HUFFMAN</text>
    <rect x="406" y="278" width="292" height="1" fill="#343a46"/>
    <text x="406" y="316" class="blue">Compressed Data</text>
    <text x="406" y="346" class="code">010011101001...</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="156" width="358" height="210" rx="10" class="panel"/>
    <text x="802" y="202" class="label">algo walkthrough</text>
    <text x="802" y="248" class="muted">frequency table</text>
    <text x="802" y="282" class="muted">minHeap inserts nodes</text>
    <text x="802" y="316" class="muted">merge two smallest</text>
    <text x="802" y="350" class="green">codebook generated</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="374" y="410" width="360" height="246" rx="10" class="panel"/>
    <text x="406" y="456" class="label">tree visualisation</text>
    <path d="M554 490L500 546M554 490L608 546M500 546L468 606M500 546L532 606M608 546L576 606M608 546L640 606" class="tree-line"/>
    <circle cx="554" cy="490" r="20" class="tree-node"/>
    <circle cx="500" cy="546" r="18" class="tree-node"/>
    <circle cx="608" cy="546" r="18" class="tree-node"/>
    <circle cx="468" cy="606" r="15" class="tree-node"/>
    <circle cx="532" cy="606" r="15" class="tree-node"/>
    <circle cx="576" cy="606" r="15" class="tree-node"/>
    <circle cx="640" cy="606" r="15" class="tree-node"/>
    <text x="554" y="497" text-anchor="middle" class="muted">13</text>
    <text x="500" y="553" text-anchor="middle" class="muted">7</text>
    <text x="608" y="553" text-anchor="middle" class="muted">6</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="770" y="410" width="358" height="246" rx="10" class="panel"/>
    <text x="802" y="456" class="label">runtime sample</text>
    <path d="M820 604H1086M820 604V500" stroke="#343a46" stroke-width="2"/>
    <path d="M836 588L880 578L924 558L968 546L1012 520L1070 504" class="plot-line"/>
    <circle cx="836" cy="588" r="4" fill="#a6e3a1"/>
    <circle cx="880" cy="578" r="4" fill="#a6e3a1"/>
    <circle cx="924" cy="558" r="4" fill="#a6e3a1"/>
    <circle cx="968" cy="546" r="4" fill="#a6e3a1"/>
    <circle cx="1012" cy="520" r="4" fill="#a6e3a1"/>
    <circle cx="1070" cy="504" r="4" fill="#a6e3a1"/>
    <text x="802" y="492" class="muted">input size vs time</text>
    <text x="802" y="636" class="blue">estimated complexity fit</text>
  </g>
</svg>
