<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">FIX Engine protocol flow diagram</title>
  <desc id="desc">A technical diagram showing a FIX wire message parsed into structured fields, validated with protocol checks and the FIX dictionary, then handed to session flow.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#111317"/>
      <stop offset="0.52" stop-color="#171b22"/>
      <stop offset="1" stop-color="#101115"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1">
      <stop offset="0" stop-color="#f38ba8"/>
      <stop offset="1" stop-color="#89dceb"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="userSpaceOnUse">
      <path d="M0 0L8 4L0 8Z" fill="#7f8ea3"/>
    </marker>
    <style>
      .title { fill: #f38ba8; font: 800 42px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .label { fill: #cdd6f4; font: 700 24px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .small { fill: #a6adc8; font: 500 18px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .code { fill: #f5e0dc; font: 500 22px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .muted { fill: #8b91a8; font: 500 16px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .ok { fill: #9ec8b6; font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .warn { fill: #d8c38f; font: 700 20px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; letter-spacing: 0; }
      .panel { fill: #1b1f27; stroke: #343a46; stroke-width: 2; }
      .node { fill: #202632; stroke: #5b6576; stroke-width: 2; }
      .flow { fill: none; stroke: #7f8ea3; stroke-width: 3; stroke-linecap: round; marker-end: url(#arrow); }
      .soft-flow { fill: none; stroke: #596575; stroke-width: 2.5; stroke-linecap: round; marker-end: url(#arrow); opacity: 0.95; }
    </style>
  </defs>

  <rect width="1200" height="750" fill="url(#bg)"/>
  <path d="M0 92H1200M0 188H1200M0 284H1200M0 380H1200M0 476H1200M0 572H1200M0 668H1200" stroke="#252a33" stroke-width="1"/>
  <path d="M120 0V750M240 0V750M360 0V750M480 0V750M600 0V750M720 0V750M840 0V750M960 0V750M1080 0V750" stroke="#20242c" stroke-width="1"/>

  <text x="72" y="76" class="title">FIXEngine</text>
  <text x="72" y="114" class="small">wire protocol, ordered fields, validation, session state</text>

  <g filter="url(#shadow)">
    <rect x="72" y="170" width="418" height="226" rx="10" class="panel"/>
    <text x="104" y="214" class="label">wire message</text>
    <text x="104" y="262" class="code">8=FIX.4.2|9=55|35=0|</text>
    <text x="104" y="298" class="code">49=SENDER|56=TARGET|</text>
    <text x="104" y="334" class="code">34=2|52=20260311-12:00:00|</text>
    <text x="104" y="370" class="code">10=063|</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="548" y="248" width="110" height="68" rx="8" class="node"/>
    <text x="603" y="277" text-anchor="middle" class="label">parse</text>
    <text x="603" y="302" text-anchor="middle" class="muted">SOH split</text>
  </g>

  <path d="M502 282H536" class="flow"/>
  <path d="M670 282H704" class="flow"/>

  <g filter="url(#shadow)">
    <rect x="714" y="170" width="414" height="226" rx="10" class="panel"/>
    <text x="748" y="214" class="label">structured fields</text>
    <text x="748" y="258" class="code">8  BeginString</text>
    <text x="748" y="294" class="code">35 MsgType</text>
    <text x="748" y="330" class="code">49 SenderCompID</text>
    <text x="748" y="366" class="code">56 TargetCompID</text>
  </g>

  <path d="M603 328V438" class="soft-flow"/>

  <g filter="url(#shadow)">
    <rect x="302" y="462" width="430" height="178" rx="10" class="panel"/>
    <text x="336" y="510" class="label">protocol validation</text>
    <text x="336" y="556" class="ok">BodyLength</text>
    <text x="530" y="556" class="ok">CheckSum</text>
    <text x="336" y="596" class="warn">FIX42.xml dictionary</text>
    <text x="336" y="626" class="muted">required fields, message types, enums</text>
  </g>

  <path d="M744 552H810" class="soft-flow"/>

  <g filter="url(#shadow)">
    <rect x="822" y="462" width="306" height="178" rx="10" class="panel"/>
    <text x="856" y="510" class="label">session flow</text>
    <text x="856" y="556" class="code">Logon</text>
    <text x="856" y="592" class="code">Heartbeat</text>
    <text x="856" y="626" class="muted">MsgSeqNum and state</text>
  </g>
</svg>
